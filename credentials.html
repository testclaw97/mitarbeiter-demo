<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:grid;place-items:center;background:#F4F6FB;color:#101529;padding:20px;overflow:hidden}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
  .b1{width:520px;height:520px;background:#DDE2FF;top:-160px;right:-120px}
  .b2{width:460px;height:460px;background:#EADFFB;bottom:-160px;left:-120px}
  .card{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;border:1px solid #EAEDF4;
    border-radius:22px;box-shadow:0 4px 8px rgba(16,21,41,.05),0 24px 60px rgba(16,21,41,.12);padding:34px 30px;text-align:center}
  .mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#5B6BF0,#8B5CF6);
    display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 8px 20px rgba(91,107,240,.4)}
  .mark svg{width:26px;height:26px}
  h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  p{font-size:13.5px;color:#5A6178;margin:8px 0 22px}
  input{width:100%;font-family:inherit;font-size:15px;text-align:center;letter-spacing:.06em;padding:13px;
    border:1px solid #EAEDF4;border-radius:13px;background:#FBFCFE;transition:border .15s}
  input:focus{outline:none;border-color:#5B6BF0;background:#fff}
  button{width:100%;margin-top:12px;font-family:inherit;font-weight:700;font-size:14px;color:#fff;padding:13px;
    border:none;border-radius:13px;background:linear-gradient(135deg,#5B6BF0,#8B5CF6);cursor:pointer;
    box-shadow:0 6px 16px rgba(91,107,240,.35);transition:transform .15s,box-shadow .15s}
  button:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,107,240,.45)}
  button:disabled{opacity:.6;cursor:default;transform:none}
  .err{color:#D6455D;font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px;opacity:0;transition:opacity .2s}
  .err.show{opacity:1}
  .foot{position:relative;z-index:1;font-size:11.5px;color:#959BAC;margin-top:18px}
</style>
</head>

  <h1>Decision brief</h1>
  <p>Enter the password to view the decision brief.</p>
  <input id="pw" type="password" inputmode="numeric" placeholder="Password" autofocus />
  <button id="go" type="submit">Unlock</button>

</form>

  function b64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  async function unlock(pw){
    var enc=new TextEncoder();
    var mat=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
      mat,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.data));
    return new TextDecoder().decode(buf);
  }
  var form=document.getElementById('gate'),err=document.getElementById('err'),go=document.getElementById('go');
  form.addEventListener('submit',async function(e){
    e.preventDefault(); err.classList.remove('show'); go.disabled=true; go.textContent='Unlocking…';
    try{
      var html=await unlock(document.getElementById('pw').value);
      document.open(); document.write(html); document.close();
    }catch(ex){
      go.disabled=false; go.textContent='Unlock'; err.classList.add('show');
      var i=document.getElementById('pw'); i.value=''; i.focus();
    }
  });
